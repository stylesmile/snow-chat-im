name: snow_chat
description: A real-time chat application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # MQTT
  mqtt_client: ^10.5.1
  
  # Local storage
  sqflite: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  
  # Network
  dio: ^5.4.0
  
  # Multimedia
  image_picker: ^1.0.0
  video_player: ^2.8.0
  cached_network_image: ^3.3.0
  
  # Internationalization
  intl: ^0.20.2

  # Utilities
  uuid: ^4.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.2.0
  shared_preferences: ^2.2.2
  
  # UI
  flutter_slidable: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0

  # Pinyin
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: 2.4.0+3

flutter:
  uses-material-design: true
  
  # Enable localization
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  locales:
    - zh
    - en
    - zh_TW
    - ja
    - ko

# 配置 sqlite3 使用系统/已打包的 SQLite 库，避免构建时从 GitHub 下载预编译库失败。
hooks:
  user_defines:
    sqlite3:
      source: system
