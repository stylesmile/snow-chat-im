server:
  port: 8091

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/snow_chat_im?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    druid:
      initial-size: 1
      max-active: 20
      min-idle: 1
      validation-query: select 'x'
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000

mybatis-plus:
  mapper-locations: classpath*:/mapper/*/**Mapper.xml
  type-aliases-package: com.stylesmile.chat.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      field-strategy: not_empty
      column-underline: true
      logic-delete-value: 0
      logic-not-delete-value: 1
      db-type: MYSQL
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

chat:
  mqtt:
    broker-url: tcp://127.0.0.1:1883
    username: mica
    password: 123456

mica:
  mqtt:
    enabled: true
    server:
      enabled: true
      port: 1883

logging:
  level:
    com.stylesmile: debug

# MinIO 对象存储配置（私有 + Pre-signed URL 策略）
# enabled=false 时降级到 InMemoryFileStorage（本地开发/测试）
# 启用方式：docker compose up -d minio，然后改 enabled: true
minio:
  enabled: false                              # 默认关闭，避免无 MinIO 时启动失败
  endpoint: http://192.168.0.106:9000             # MinIO API 端点
  access-key: minioadmin                      # 默认访问密钥
  secret-key: minioadmin                      # 默认秘密密钥
  bucket: snow-chat                           # bucket 名称
  public-url: ""                              # 私有策略下未使用，保留字段
  region: us-east-1                           # 区域
  public-read-policy: false                   # 私有策略：不设置公共读

# 邮箱发送配置（用于验证码、找回密码等场景）
email:
  smtp-host: smtpout.secureserver.net
  smtp-port: 465
  username: xxx
  password: xxx
  from: xxx
