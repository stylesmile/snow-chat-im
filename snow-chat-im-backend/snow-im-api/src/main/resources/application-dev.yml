server:
  port: 8091

spring:
  data:
    redis:
      host: localhost
      database: 1
      port: 6379
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 必须填 Java 字符集名：utf8mb4 是 MySQL 的字符集名，Java 不认识，
    # Connector/J 8.0.32 会直接抛 WrongArgumentException: Unsupported character encoding 'utf8mb4'；
    # 填 UTF-8 后由 MySQL 8 服务端默认排序规则映射为 utf8mb4，实际存储语义不变（仍支持 emoji）
    url: jdbc:mysql://localhost:3306/snow_chat_im?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    druid:
      initial-size: 1
      max-active: 20
      min-idle: 1
      validation-query: select 'x'
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000

mybatis-plus:
  mapper-locations: classpath*:/mapper/*/**Mapper.xml
  type-aliases-package: com.stylesmile.chat.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      field-strategy: not_empty
      column-underline: true
      logic-delete-value: 0
      logic-not-delete-value: 1
      db-type: MYSQL
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

chat:
  mqtt:
    broker-url: tcp://127.0.0.1:1883
    username: mica
    password: 123456

mica:
  mqtt:
    enabled: true
    server:
      enabled: true
      port: 1883

logging:
  level:
    com.stylesmile: debug

# ============================================================
# 文件存储配置：由 storage.type 统一决定启用哪一个实现
#   local      - InMemoryFileStorage（内存降级，重启即丢失，仅本地开发/测试）
#   disk       - LocalDiskFileStorage（落盘 + /file/raw/** 真实 HTTP 地址，重启不丢）
#   minio      - MinioFileStorage（S3 协议，需自行部署 MinIO）
#   seaweedfs  - SeaweedfsFileStorage（SeaweedFS REST API，需自行部署 SeaweedFS）
#   aliyun-oss - AliyunOssFileStorage（阿里云 OSS，无需自建服务）
# 注意：storage.type 是唯一开关，各段中的 enabled 字段仅保留兼容，不再参与装配
# ============================================================
storage:
  type: disk                          # 本地联调落盘存储：文件存盘且对外是真实 URL（非 base64）

# 本地磁盘存储（storage.type=disk 时生效）
# public-url 必须是「前端设备真正能访问到后端」的地址：
# 真机/模拟器上 127.0.0.1 指向手机自己，故这里填本机局域网 IP
disk:
  path: ~/snow-file                       # 落盘根目录（支持 ~ 展开）
  public-url: http://192.168.0.100:8091   # 外部访问前缀，拼接成 /file/raw/{key}

local:
  endpoint: http://127.0.0.1:8888
  path: ~/snow-file

# MinIO 对象存储配置（私有 + Pre-signed URL 策略）
# storage.type=minio 时生效；enabled=false 时降级到 InMemoryFileStorage（本地开发/测试）
# 启用方式：docker compose up -d minio，然后 storage.type: minio
minio:
  enabled: false                              # 默认关闭，避免无 MinIO 时启动失败
  endpoint: http://192.168.0.106:9000             # MinIO API 端点
  access-key: minioadmin                      # 默认访问密钥
  secret-key: minioadmin                      # 默认秘密密钥
  bucket: snow-chat                           # bucket 名称
  public-url: ""                              # 私有策略下未使用，保留字段
  region: us-east-1                           # 区域
  public-read-policy: false                   # 私有策略：不设置公共读

# SeaweedFS 对象存储配置
# storage.type=seaweedfs 时生效；需先启动 SeaweedFS（docker compose up -d seaweedfs）
# 公共读模式：文件通过 endpoint/filename 直接访问，数据库存完整 URL
seaweedfs:
  enabled: false                              # 兼容字段，已不参与装配（实际由 storage.type 决定）
  endpoint: http://127.0.0.1:8888             # SeaweedFS Master 服务地址
  upload-path: /1                             # 上传目标 volume 路径（由 SeaweedFS volume id 决定）
  public-read: true                           # 公共读策略：true 时数据库存完整可访问 URL
  public-base-url: ""                         # 外部 CDN 或公网前缀；为空时使用 endpoint 作为访问前缀

# 阿里云 OSS 对象存储配置
# storage.type=aliyun-oss 时生效
# 安全建议：使用 RAM 子账号 AccessKey 并仅授予该 bucket 的读写权限，
#          凭据请通过环境变量或配置中心注入，不要提交真实 ak/sk 到版本库
aliyun-oss:
  endpoint: https://oss-cn-hangzhou.aliyuncs.com  # OSS 区域端点（须与 bucket 所在地域一致）
  access-key-id: ""                               # AccessKey ID（生产环境用环境变量覆盖）
  access-key-secret: ""                           # AccessKey Secret
  bucket: snow-chat                               # bucket 名称
  public-base-url: ""                             # 自定义域名/CDN 前缀；留空则按 {bucket}.{endpoint} 推导
  public-read: true                               # true=公共读（返回直链）；false=私有读（返回签名 URL）
  presign-expiration-minutes: 10080               # 私有读签名有效期（分钟），默认 7 天

# 邮箱发送配置（用于验证码、找回密码等场景）
email:
  smtp-host: smtpout.secureserver.net
  smtp-port: 465
  username: xxx
  password: xxx
  from: xxx
