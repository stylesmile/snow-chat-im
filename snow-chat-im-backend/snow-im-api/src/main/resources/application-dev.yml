server:
  port: 8091

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/snow_chat_im?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=GMT&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    druid:
      initial-size: 1
      max-active: 20
      min-idle: 1
      validation-query: select 'x'
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000

mybatis-plus:
  mapper-locations: classpath*:/mapper/*/**Mapper.xml
  type-aliases-package: com.stylesmile.chat.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      field-strategy: not_empty
      column-underline: true
      logic-delete-value: 0
      logic-not-delete-value: 1
      db-type: MYSQL
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

chat:
  mqtt:
    broker-url: tcp://127.0.0.1:1883
    username: mica
    password: 123456

mica:
  mqtt:
    enabled: true
    server:
      enabled: true
      port: 1883

logging:
  level:
    com.stylesmile: debug

# 文件存储类型配置
# local   - InMemoryFileStorage（内存降级，应用重启后文件丢失，适合本地开发）
# minio   - MinioFileStorage（基于 S3 协议的对象存储，需单独部署 MinIO）
# seaweedfs - SeaweedfsFileStorage（基于 SeaweedFS REST API 的对象存储，需单独部署 SeaweedFS）
storage:
  type: local                         # 默认 local，启用其他类型需同时配置对应服务端点

# MinIO 对象存储配置（私有 + Pre-signed URL 策略）
# storage.type=minio 时生效；enabled=false 时降级到 InMemoryFileStorage（本地开发/测试）
# 启用方式：docker compose up -d minio，然后 storage.type: minio
minio:
  enabled: false                              # 默认关闭，避免无 MinIO 时启动失败
  endpoint: http://192.168.0.106:9000             # MinIO API 端点
  access-key: minioadmin                      # 默认访问密钥
  secret-key: minioadmin                      # 默认秘密密钥
  bucket: snow-chat                           # bucket 名称
  public-url: ""                              # 私有策略下未使用，保留字段
  region: us-east-1                           # 区域
  public-read-policy: false                   # 私有策略：不设置公共读

# SeaweedFS 对象存储配置
# storage.type=seaweedfs 时生效；需先启动 SeaweedFS（docker compose up -d seaweedfs）
# 公共读模式：文件通过 endpoint/filename 直接访问，数据库存完整 URL
seaweedfs:
  enabled: false                              # 默认关闭，避免无 SeaweedFS 时启动失败
  endpoint: http://127.0.0.1:8888             # SeaweedFS Master 服务地址
  upload-path: /1                             # 上传目标 volume 路径（由 SeaweedFS volume id 决定）
  public-read: true                           # 公共读策略：true 时数据库存完整可访问 URL
  public-base-url: ""                         # 外部 CDN 或公网前缀；为空时使用 endpoint 作为访问前缀

# 邮箱发送配置（用于验证码、找回密码等场景）
email:
  smtp-host: smtpout.secureserver.net
  smtp-port: 465
  username: xxx
  password: xxx
  from: xxx
